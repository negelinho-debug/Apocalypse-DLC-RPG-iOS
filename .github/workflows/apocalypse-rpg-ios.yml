          if html.count(main) != 1:
              raise ValueError("Could not find main.js in index.html")
          index.write_text(html.replace(main, tags + main))
          PY

      - name: Set up the Xcode project
        run: |
          npx --no-install cap add ios --packagemanager SPM
          python3 - <<'PY'
          from pathlib import Path
          import plistlib

          info = Path("ios/App/App/Info.plist")
          settings = plistlib.loads(info.read_bytes())
          landscape = ["UIInterfaceOrientationLandscapeLeft", "UIInterfaceOrientationLandscapeRight"]
          settings["UISupportedInterfaceOrientations"] = landscape
          settings["UISupportedInterfaceOrientations~ipad"] = landscape
          settings["UIRequiresFullScreen"] = True
          settings["UIStatusBarHidden"] = True
          settings["UIViewControllerBasedStatusBarAppearance"] = False
          info.write_bytes(plistlib.dumps(settings, sort_keys=False))
          PY
          ffmpeg -hide_banner -loglevel error -y -i www/icon/icon.png \
            -vf 'scale=1024:1024:flags=lanczos,format=rgb24' -frames:v 1 \
            ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png

      - name: Build the unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild build -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/apocalypse-build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package and check the IPA
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/apocalypse-build/Build/Products/Release-iphoneos/App.app" Payload/
          test -f Payload/App.app/public/data/Map002.json
          test -f Payload/App.app/public/js/touch.js
          file Payload/App.app/App | grep arm64
          ditto -c -k --keepParent Payload Apocalypse-DLC-RPG-iOS-unsigned.ipa
          unzip -tq Apocalypse-DLC-RPG-iOS-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Apocalypse-DLC-RPG-iOS
          path: Apocalypse-DLC-RPG-iOS-unsigned.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Apocalypse-iOS-build-log
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/extraction.log
